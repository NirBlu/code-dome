<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Dome</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="hud">
        <header id="top-bar">
          <div id="brand">Code Dome</div>
          <div id="path-ribbon"></div>
          <div id="counts"></div>
          <div id="depth-meter" title="Depth / membranes"></div>
          <input id="search" type="search" placeholder="Search cwd…" autocomplete="off" />
          <button id="btn-open-folder" type="button" title="Map a local folder as a world (File System Access)">Open folder</button>
          <button id="btn-browse" type="button" title="Browse via webkitdirectory (works in more browsers)">Browse…</button>
          <button id="btn-local-drives" type="button" class="hidden" title="List real Linux drives via Vite dev bridge">Local drives</button>
          <button id="btn-demo" type="button" title="Load multi-drive demo">Demo</button>
        </header>
        <input id="folder-input" type="file" webkitdirectory multiple class="hidden" tabindex="-1" aria-hidden="true" />
        <aside id="inspector" class="hidden">
          <div id="inspector-head">
            <strong id="insp-name"></strong>
            <button id="insp-close" type="button" aria-label="Close">×</button>
          </div>
          <div id="insp-meta"></div>
          <div id="insp-path-row">
            <code id="insp-path"></code>
            <button id="insp-copy" type="button">Copy</button>
          </div>
          <div id="insp-actions"></div>
        </aside>
        <div id="search-results" class="hidden"></div>
        <div id="minimap-wrap">
          <div id="minimap-head">
            <span>Navigator</span>
            <button id="minimap-hide" type="button">Hide</button>
          </div>
          <canvas id="minimap" width="240" height="260"></canvas>
        </div>
        <div id="look-banner" class="hidden">Click view to look around · Esc to release</div>
        <div id="orbit-hint" class="hidden">Free orbit · click a labeled world to land</div>
        <div id="crosshair"></div>
        <div id="toast" class="hidden"></div>
        <div id="editor-pane" class="hidden">
          <div id="editor-head">
            <span id="editor-title"></span>
            <button id="editor-close" type="button">×</button>
          </div>
          <pre id="editor-body"></pre>
        </div>
        <div id="help">
          <strong>WASD</strong> move · <strong>Click view</strong> to look · <strong>Esc</strong> release / back
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
